<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Corporate Directory | M. Amirul Shah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div class="viewport-wrapper">
        <header class="navbar">
            <div class="container">
                <div class="brand">PERODUA<span> MANUFACTURING</span></div>
                <div class="status-tag">Internal System</div>
            </div>
        </header>
 
        <main class="main-content">
            <div class="profile-card">
                <div class="profile-header">
                    <img src="./assets/profile.jpg" alt="Profile" class="profile-img">
                    <div class="profile-text">
                        <span class="badge">CSQ | EXECUTIVE</span>
                        <h1>MUHAMMAD AMIRUL SHAH</h1>
                        <p class="sub">Perodua Manufacturing Sdn Bhd</p>
                    </div>
                </div>
 
                <div class="info-grid">
                    <div class="info-item">
                        <label>Direct Email</label>
                        <a href="mailto:amirul.nordin@perodua.com.my">amirul.nordin@perodua.com.my</a>
                    </div>
                    <div class="info-item">
                        <label>Mobile</label>
                        <a href="tel:+601128757244">+6011-287 57244</a>
                    </div>
                    <div class="info-item">
                        <label>Office Line</label>
                        <span>+603-6092 8888</span>
                    </div>
                    <div class="info-item">
                        <label>Domain</label>
                        <a href="https://www.perodua.com.my">perodua.com.my</a>
                    </div>
                    <div class="info-item full">
                        <label>Stationed At</label>
                        <span>Rawang, Selangor, Malaysia</span>
                    </div>
                </div>
 
                <div class="actions">
                    <button class="btn btn-print" onclick="window.print()">PRINT RECORD</button>
                    <button class="btn btn-share" id="shareBtn">SHARE PROFILE</button>
                </div>
            </div>
        </main>
 
        <footer class="mini-footer">
            <p>&copy; 2026 Perodua Corporate Directory</p>
        </footer>
    </div>
 
    <div id="shareModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn">&times;</span>
            <div class="qr-box">
                <img id="qrCodeImg" src="" alt="QR Code">
            </div>
            <a id="whatsappLink" href="#" target="_blank" class="wa-btn">WhatsApp Share</a>
        </div>
    </div>
 
    <script src="script.js"></script>
</body>
</html>
